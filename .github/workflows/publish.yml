name: Publish

on:
  push:
    branches: [development, master]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Run tests
        run: pytest

  # development branch -> TestPyPI as <base>.dev<run_number>
  publish-testpypi:
    if: github.ref == 'refs/heads/development'
    needs: test
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rewrite version to dev build
        run: |
          BASE=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)
          DEV="${BASE}.dev${GITHUB_RUN_NUMBER}"
          sed -i "s/^version = \".*\"/version = \"${DEV}\"/" pyproject.toml
          echo "Publishing ${DEV} to TestPyPI"

      - name: Build sdist and wheel
        run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # master branch -> official PyPI, version taken from pyproject.toml as-is
  publish-pypi:
    if: github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
