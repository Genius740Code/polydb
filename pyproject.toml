[project]
name = "genius74o-polydb"
version = "0.1.0"
description = "One async API for Postgres, MongoDB, SQLite, and MySQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["asyncpg"]
mongo = ["motor"]
sqlite = ["aiosqlite"]
mysql = ["asyncmy"]
all = ["asyncpg", "motor", "aiosqlite", "asyncmy"]
dev = ["pytest", "pytest-asyncio", "hypothesis", "testcontainers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polydb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
